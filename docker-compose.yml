services:
  pixelwish-bot:
    build:
      context: .
    image: pixelwish-bot:local
    container_name: pixelwish-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=10 -XX:+UseSerialGC -XX:MaxDirectMemorySize=64m -Djava.security.egd=file:/dev/urandom"
    restart: unless-stopped
    mem_limit: 384m
